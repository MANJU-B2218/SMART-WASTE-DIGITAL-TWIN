        body {

            color: #f8fafc;

        /* Ambient Glowing Canvas */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(6, 182, 212, 0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.06) 0%, transparent 60%);

            z-index: 0;
        }

        /* Glassmorphic Slide Container */
        .slide-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
            z-index: 10;
        }

        .slide-card {
            width: 100%;
            max-width: 1140px;
            height: 90vh;
            max-height: 720px;
            background: rgba(14, 23, 38, 0.88);
            backdrop-filter: blur(24px);

            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(16, 185, 129, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            position: relative;
            overflow: hidden;
            animation: slideFadeIn 0.35s ease-out;
        }

        @keyframes slideFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glow Accents */
        .glow-tag {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Bottom Controls Bar */
        .nav-controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(13, 21, 34, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 9999px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Speaker Notes Panel */
        #speaker-notes-panel {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            width: calc(100% - 48px);
            max-width: 800px;
            background: rgba(11, 17, 28, 0.97);
            backdrop-filter: blur(20px);
            border: 1px solid #3b82f6;
            border-radius: 20px;
            padding: 18px 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            display: none;
            animation: notesFade 0.25s ease-out;
        }

        @keyframes notesFade {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Print Media Styles (For Printing Complete Deck to PDF) */
        @media print {
            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
            }
            .ambient-mesh, .nav-controls, #speaker-notes-panel, .no-print {
                display: none !important;
            }
            .slide-container {
                page-break-after: always;
                height: 100vh !important;
                padding: 0 !important;
            }
            .slide-card {
                background: white !important;
                color: black !important;
                border: 2px solid #cbd5e1 !important;
                box-shadow: none !important;

            // Update Progress & Indicator
            indicator.textContent = `${String(index + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
            progressBar.style.width = `${((index + 1) / SLIDES.length) * 100}%`;

            // Update Notes
            notesContent.textContent = slide.notes;
        }

        function nextSlide() {
            if (currentSlideIndex < SLIDES.length - 1) {
                renderSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                renderSlide(currentSlideIndex - 1);
            }
        }

        function toggleSpeakerNotes() {
            const panel = document.getElementById('speaker-notes-panel');
            const btn = document.getElementById('btn-notes');
            isNotesOpen = !isNotesOpen;

            if (isNotesOpen) {
                panel.style.display = 'block';
                btn.classList.add('bg-slate-800', 'text-white');
            } else {
                panel.style.display = 'none';
                btn.classList.remove('bg-slate-800', 'text-white');
            }
        }

        function toggleFullscreen() {
            const icon = document.getElementById('fullscreen-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                icon.className = "fa-solid fa-compress";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.className = "fa-solid fa-expand";
                }
            }
        }

        // Keyboard Navigation (Arrow Keys, Spacebar, N for notes, F for fullscreen)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'n' || e.key === 'N') {
                toggleSpeakerNotes();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // Initialize First Slide
        renderSlide(0);
    </script>
</body>
</html>
